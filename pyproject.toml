[project]
name = "anchor-development"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.4",
    "PyYAML>=6.0",
    "types-PyYAML>=6.0",
    "pyright>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]
addopts = "--strict-config --strict-markers -ra"

[tool.pyright]
include = ["test"]
extraPaths = ["test"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
